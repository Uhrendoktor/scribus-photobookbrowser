name: Temporary cleanup

on:
  push:
    paths:
      - '.github/workflows/_cleanup.yml'

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
      issues: write
    steps:
      - name: Checkout GPT-ToolsAndStorage
        uses: actions/checkout@v4
        with:
          repository: Uhrendoktor/GPT-ToolsAndStorage
          path: tooling

      - name: Run canonical cleanup tooling
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 tooling/tools/gpt_tools.py gc --keep 1

      - name: Report completion
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          gh issue comment 3 --body "GPT-ToolsAndStorage cleanup tooling finished with status: ${STATUS}."
          gh issue close 3 --reason completed
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/contents/.github/workflows/_cleanup.yml" \
            -f message='Remove temporary cleanup workflow' \
            -f sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/.github/workflows/_cleanup.yml" --jq .sha)"
