name: Build and Release

on:
  push:
    branches:
      - "port/scribus-1.7.x"
    tags:
      - "*"

concurrency:
  group: scribus-1.7x-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/port/scribus-1.7.x' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        scribus-version: [1.7.0, 1.7.1, 1.7.2, 1.7.3]

    permissions:
      contents: write

    env:
      BUILD_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'test-scribus-1.7x-20260821' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Scribus
        run: |
          chmod +x ./build-scribus.sh
          SCRIBUS_VERSION=${{ matrix.scribus-version }} BUILD_JOBS=4 ./build-scribus.sh

      - name: Build Plugin
        run: |
          chmod +x ./build-plugin.sh
          SCRIBUS_VERSION=${{ matrix.scribus-version }} VERSION=${BUILD_VERSION} BUILD_JOBS=4 ./build-plugin.sh

      - name: Verify exported artifact
        run: |
          ls -lah ./dist
          test -f ./dist/photobookbrowser-${BUILD_VERSION}-scribus-${{ matrix.scribus-version }}-linux-x86_64.so

      - name: Upload artifact to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ./dist/photobookbrowser-${BUILD_VERSION}-scribus-${matrix.scribus-version}-linux-x86_64.so
