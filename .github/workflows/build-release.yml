name: Build and Release

on:
  push:
    branches: [main]
    tags:
      - "*.*.*"
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Plugin version identifier (for example 0.1.2-test)"
        required: true
        type: string

concurrency:
  group: photobookbrowser-build-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cancel-stale:
    name: Cancel superseded CI runs
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read
    steps:
      - name: Cancel older runs on this branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          stale_runs="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow build-release.yml \
            --branch "$GITHUB_REF_NAME" \
            --limit 50 \
            --json databaseId,headSha,status \
            --jq ".[] | select(.headSha != \"$GITHUB_SHA\" and .status != \"completed\") | .databaseId")"
          while IFS= read -r run_id; do
            [[ -z "$run_id" ]] && continue
            echo "Cancelling superseded workflow run $run_id"
            gh run cancel "$run_id" --repo "$GITHUB_REPOSITORY" || true
          done <<< "$stale_runs"

  build-linux:
    needs: cancel-stale
    name: Linux / Scribus ${{ matrix.scribus-version }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - scribus-version: "1.6.5"
            runner: ubuntu-22.04
          - scribus-version: "1.6.6"
            runner: ubuntu-22.04
          - scribus-version: "1.6.7"
            runner: ubuntu-22.04
          - scribus-version: "1.7.0"
            runner: ubuntu-24.04
          - scribus-version: "1.7.1"
            runner: ubuntu-24.04
          - scribus-version: "1.7.2"
            runner: ubuntu-24.04
          - scribus-version: "1.7.3"
            runner: ubuntu-24.04
          - scribus-version: "1.7.4"
            runner: ubuntu-26.04

    env:
      BUILD_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || format('0.0.0-ci.{0}', github.run_number) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate version
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == refs/tags/* ]]; then
            if [[ ! "$BUILD_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Invalid release tag version: $BUILD_VERSION"
              exit 1
            fi
          elif [[ ! "$BUILD_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid CI version: $BUILD_VERSION"
            exit 1
          fi

      - name: Install Scribus build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ca-certificates cmake git wget curl bzip2 xz-utils file \
            pkg-config ccache extra-cmake-modules gettext \
            libcairo2-dev libcdr-dev libcups2-dev libfontconfig1-dev libfreehand-dev \
            libfreetype6-dev libgraphicsmagick++1-dev libharfbuzz-dev libhunspell-dev \
            libhyphen-dev libicu-dev libjpeg-dev liblcms2-dev libmspub-dev \
            libopenscenegraph-dev libpagemaker-dev libpng-dev libpodofo-dev \
            libpoppler-cpp-dev libpoppler-dev libpoppler-private-dev libqxp-dev \
            librevenge-dev libtiff-dev libvisio-dev libwpg-dev libxml2-dev libzmf-dev \
            libboost-dev python3-dev zlib1g-dev
          if [[ "${{ matrix.scribus-version }}" == 1.6.* ]]; then
            sudo apt-get install -y --no-install-recommends \
              libqt5opengl5-dev libqt5webkit5-dev qtbase5-dev qttools5-dev qttools5-dev-tools
          else
            sudo apt-get install -y --no-install-recommends \
              qt6-base-dev qt6-base-private-dev qt6-5compat-dev qt6-svg-dev \
              qt6-tools-dev qt6-tools-dev-tools qt6-l10n-tools
          fi

      - name: Download Scribus source and integrate PhotoBook Browser
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ matrix.scribus-version }}"
          if [[ "$VERSION" == 1.6.* ]]; then
            SERIES="scribus"
          else
            SERIES="scribus-devel"
          fi
          ARCHIVE="$RUNNER_TEMP/scribus-$VERSION.tar.xz"
          curl -fL --retry 4 \
            "https://downloads.sourceforge.net/project/scribus/$SERIES/$VERSION/scribus-$VERSION.tar.xz" \
            -o "$ARCHIVE"
          tar -xJf "$ARCHIVE" -C "$RUNNER_TEMP"
          SCRIBUS_SRC="$RUNNER_TEMP/scribus-$VERSION"
          test -f "$SCRIBUS_SRC/CMakeLists.txt"
          mkdir -p "$SCRIBUS_SRC/scribus/plugins/photobookbrowser"
          cp -R "$GITHUB_WORKSPACE/plugin/." "$SCRIBUS_SRC/scribus/plugins/photobookbrowser/"
          python3 - "$SCRIBUS_SRC/scribus/plugins/CMakeLists.txt" <<'PY'
          from pathlib import Path
          import re
          import sys

          path = Path(sys.argv[1])
          source = path.read_text(encoding="utf-8")
          if not re.search(r"add_subdirectory\s*\(\s*photobookbrowser\s*\)", source, re.I):
              source, count = re.subn(
                  r"(^[ \t]*add_subdirectory\s*\(\s*picbrowser\s*\)[ \t]*$)",
                  r"\1\nadd_subdirectory(photobookbrowser)",
                  source,
                  count=1,
                  flags=re.I | re.M,
              )
              if count != 1:
                  raise SystemExit("Could not locate Scribus' picbrowser CMake entry")
              path.write_text(source, encoding="utf-8")
          PY

      - name: Configure and compile PhotoBook Browser
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ matrix.scribus-version }}"
          SCRIBUS_SRC="$RUNNER_TEMP/scribus-$VERSION"
          BUILD_DIR="$RUNNER_TEMP/scribus-build"
          cmake -S "$SCRIBUS_SRC" -B "$BUILD_DIR" \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/scribus-install" \
            -DWANT_PCH=OFF \
            -DCMAKE_CXX_FLAGS="-O2 -g"
          cmake --build "$BUILD_DIR" --target photobookbrowser --parallel 4
          PLUGIN="$(find "$BUILD_DIR" -type f -name '*photobookbrowser*.so' -print -quit)"
          test -n "$PLUGIN"
          file "$PLUGIN"
          mkdir -p ./dist
          cp "$PLUGIN" "./dist/photobookbrowser-$BUILD_VERSION-scribus-$VERSION-linux-x86_64.so"

      - name: Verify Linux plugin
        run: |
          ls -lah ./dist
          test -f "./dist/photobookbrowser-${BUILD_VERSION}-scribus-${{ matrix.scribus-version }}-linux-x86_64.so"

      - name: Upload Linux CI build
        uses: actions/upload-artifact@v7
        with:
          name: photobookbrowser-linux-${{ matrix.scribus-version }}-${{ env.BUILD_VERSION }}
          path: ./dist/photobookbrowser-${{ env.BUILD_VERSION }}-scribus-${{ matrix.scribus-version }}-linux-x86_64.so
          if-no-files-found: error
          retention-days: 14

      - name: Publish Linux plugin to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3.0.4
        with:
          files: ./dist/photobookbrowser-${{ env.BUILD_VERSION }}-scribus-${{ matrix.scribus-version }}-linux-x86_64.so

  build-macos:
    needs: cancel-stale
    name: macOS / Scribus 1.7.4
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          brew update
          brew install cmake ninja pkgconf qt freetype cairo harfbuzz icu4c \
            jpeg-turbo libpng libtiff libxml2 little-cms2 poppler fontconfig \
            hunspell cups

      - name: Download and prepare Scribus 1.7.4 source
        shell: bash
        run: |
          set -euo pipefail
          VERSION=1.7.4
          ARCHIVE="$RUNNER_TEMP/scribus-${VERSION}.tar.xz"
          curl -fL --retry 3 \
            "https://downloads.sourceforge.net/project/scribus/scribus-devel/${VERSION}/scribus-${VERSION}.tar.xz" \
            -o "$ARCHIVE"
          tar -xJf "$ARCHIVE" -C "$RUNNER_TEMP"
          SCRIBUS_SRC="$RUNNER_TEMP/scribus-${VERSION}"
          test -f "$SCRIBUS_SRC/CMakeLists.txt"
          mkdir -p "$SCRIBUS_SRC/scribus/plugins/photobookbrowser"
          cp -R "$GITHUB_WORKSPACE/plugin/." "$SCRIBUS_SRC/scribus/plugins/photobookbrowser/"
          python3 - "$SCRIBUS_SRC/scribus/plugins/CMakeLists.txt" <<'PY'
          from pathlib import Path
          import re
          import sys

          path = Path(sys.argv[1])
          source = path.read_text(encoding="utf-8")
          if not re.search(r"add_subdirectory\s*\(\s*photobookbrowser\s*\)", source, re.I):
              source, count = re.subn(
                  r"(^[ \t]*add_subdirectory\s*\(\s*picbrowser\s*\)[ \t]*$)",
                  r"\1\nadd_subdirectory(photobookbrowser)",
                  source,
                  count=1,
                  flags=re.I | re.M,
              )
              if count != 1:
                  raise SystemExit("Could not locate Scribus' picbrowser CMake entry")
              path.write_text(source, encoding="utf-8")
          PY

      - name: Configure and build plugin
        shell: bash
        run: |
          set -euo pipefail
          PREFIX="$(brew --prefix)"
          QT_PREFIX="$(brew --prefix qt)"
          export PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig:$PREFIX/opt/icu4c/lib/pkgconfig:$PREFIX/opt/qt/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          cmake -S "$RUNNER_TEMP/scribus-1.7.4" -B "$RUNNER_TEMP/scribus-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/scribus-install" \
            -DQT_PREFIX="$QT_PREFIX" \
            -DCMAKE_INCLUDE_PATH="$PREFIX/include" \
            -DCMAKE_LIBRARY_PATH="$PREFIX/lib" \
            -DWANT_PCH=OFF \
            -DWANT_NOOSG=ON \
            -DWANT_GRAPHICSMAGICK=OFF \
            -DWITH_PODOFO=OFF \
            -DWITH_BOOST=OFF
          cmake --build "$RUNNER_TEMP/scribus-build" --target photobookbrowser --parallel 3
          PLUGIN="$(find "$RUNNER_TEMP/scribus-build" -type f \( -iname '*photobookbrowser*.dylib' -o -iname '*photobookbrowser*.so' \) -print -quit)"
          test -n "$PLUGIN"
          file "$PLUGIN"
          mkdir -p "$RUNNER_TEMP/dist"
          EXT="${PLUGIN##*.}"
          cp "$PLUGIN" "$RUNNER_TEMP/dist/photobookbrowser-0.1.0-scribus-1.7.4-macos-$(uname -m).${EXT}"

      - name: Upload macOS compile check
        uses: actions/upload-artifact@v7
        with:
          name: photobookbrowser-macos-scribus-1.7.4
          path: ${{ runner.temp }}/dist/*
          if-no-files-found: error
          retention-days: 14

  build-windows-msvc:
    needs: cancel-stale
    name: Windows x64 / Scribus 1.7.4 (MSVC 2022)
    runs-on: windows-2022
    timeout-minutes: 360
    permissions:
      contents: write
    env:
      SCRIBUS_VERSION: "1.7.4"
      BUILD_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || format('0.0.0-ci.{0}', github.run_number) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install matching Qt MSVC toolchain
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.11.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          dir: C:\s\qt
          modules: qt5compat
          archives: qtbase qtsvg
          # Qt 6.11 moved Windows kit metadata into per-kit directories.
          # Pin aqtinstall's merged support until the fix reaches a PyPI release.
          aqtsource: git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7

      - name: Cache Scribus MSVC dependencies and host import library
        uses: actions/cache@v4
        with:
          path: |
            C:\s\libs
            C:\s\Scribus-builds\Scribus-Release-x64-v143
          key: scribus-msvc-1.7.4-qt6.11.3-libs-20261026-v143-release-x64

      - name: Build an MSVC plugin for the official Scribus ABI
        shell: pwsh
        run: .\.github\scripts\build-windows-msvc.ps1 -RepositoryRoot "$env:GITHUB_WORKSPACE" -ScribusVersion "$env:SCRIBUS_VERSION" -PluginVersion "$env:BUILD_VERSION"

      - name: Upload Windows MSVC plugin
        uses: actions/upload-artifact@v7
        with:
          name: photobookbrowser-windows-msvc-scribus-1.7.4
          path: dist/photobookbrowser-*-scribus-1.7.4-windows-x64-msvc.dll
          if-no-files-found: error
          retention-days: 14

      - name: Publish Windows plugin to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3.0.4
        with:
          files: dist/photobookbrowser-*-scribus-1.7.4-windows-x64-msvc.dll
