name: Build and Release

on:
  push:
    branches:
      - "port/scribus-1.7.x"
    tags:
      - "*"

jobs:
  prepare-test-tag:
    if: github.ref == 'refs/heads/port/scribus-1.7.x'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create temporary test tag
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_TAG: test-scribus-1.7x-20260821
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --tags origin
          if git ls-remote --exit-code --tags origin "refs/tags/${TEST_TAG}" >/dev/null 2>&1; then
            echo "Temporary tag already exists: ${TEST_TAG}"
            exit 0
          fi
          git tag "${TEST_TAG}" "${GITHUB_SHA}"
          git push origin "${TEST_TAG}"

  build:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        scribus-version: [1.7.0, 1.7.1, 1.7.2]

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Scribus
        run: |
          chmod +x ./build-scribus.sh
          SCRIBUS_VERSION=${{ matrix.scribus-version }} BUILD_JOBS=2 ./build-scribus.sh

      - name: Build Plugin
        run: |
          chmod +x ./build-plugin.sh
          SCRIBUS_VERSION=${{ matrix.scribus-version }} VERSION=${{ github.ref_name }} BUILD_JOBS=2 ./build-plugin.sh

      - name: Verify exported artifact
        run: |
          ls -lah ./dist
          test -f ./dist/photobookbrowser-${{ github.ref_name }}-scribus-${{ matrix.scribus-version }}-linux-x86_64.so

      - name: Upload artifact to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./dist/photobookbrowser-${{ github.ref_name }}-scribus-${{ matrix.scribus-version }}-linux-x86_64.so

      - name: Remove temporary test tag
        if: github.ref_name == 'test-scribus-1.7x-20260821' && matrix.scribus-version == '1.7.2'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git push origin --delete "${GITHUB_REF_NAME}"
